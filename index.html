(() => {

const CHARACTERS=[{name:'BULWARK',icon:'🛡️',desc:'+25 max HP · starts with +1 armor',bonus:{maxHp:25,armor:1}},{name:'SCOUT',icon:'🛼',desc:'+18% move speed · +8% attack speed',bonus:{speed:18,attackSpeed:.08}},{name:'TINKER',icon:'🧲',desc:'+25% pickup range · +10% luck',bonus:{pickup:25,luck:10}}];

const SHOP=[
 {name:'Sharpened Edge',icon:'🗡️',desc:'+18% damage',price:12,apply:p=>p.damage*=1.18},

 {name:'Swift Soles',icon:'👟',desc:'+15% move speed',price:11,apply:p=>p.speed*=1.15},
 {name:'Lucky Charm',icon:'🍀',desc:'+15 luck',price:12,apply:p=>p.luck+=15},
 {name:'Steel Plating',icon:'🛡️',desc:'+2 armor, −8% speed',price:14,apply:p=>{p.armor+=2;p.speed*=.92}},
 {name:'Overclock',icon:'⏱️',desc:'+18% attack speed',price:13,apply:p=>p.attackSpeed*=1.18},
 {name:'Keen Eye',icon:'🎯',desc:'+8% critical chance',price:12,apply:p=>p.crit+=.08},
 {name:'Magnet Coil',icon:'🧲',desc:'+35 pickup range',price:10,apply:p=>p.pickup+=35},
 {name:'Regeneration',icon:'🌿',desc:'+1.2 HP regenerated / sec',price:13,apply:p=>p.regen+=1.2},
 {name:'Heavy Rounds',icon:'🧨',desc:'+25% damage, −10% attack speed',price:13,apply:p=>{p.damage*=1.25;p.attackSpeed*=.9}},
 {name:'Glass Anklet',icon:'🩰',desc:'+22% speed, −1 armor',price:10,apply:p=>{p.speed*=1.22;p.armor=Math.max(0,p.armor-1)}},
 {name:'Scrap Dividend',icon:'🪙',desc:'+25 coins now, −10 max HP',price:9,apply:p=>{p.coins+=25;p.maxHp=Math.max(1,p.maxHp-10);p.hp=Math.min(p.hp,p.maxHp)}},
 {name:'Feral Focus',icon:'🐾',desc:'+12% crit, −8% max HP',price:11,apply:p=>{p.crit+=.12;p.maxHp=Math.max(1,p.maxHp*.92);p.hp=Math.min(p.hp,p.maxHp)}},
 {name:'Adrenaline',icon:'🧪',desc:'+1 armor, heal 30%',price:14,apply:p=>{p.armor++;p.hp=Math.min(p.maxHp,p.hp+p.maxHp*.3)}}
];
const UPGRADES=[{name:'Muscle Memory',icon:'💪',desc:'+12% damage',apply:p=>p.damage*=1.12},{name:'Quick Hands',icon:'⚡',desc:'+12% attack speed',apply:p=>p.attackSpeed*=1.12},{name:'Hard Shell',icon:'🛡️',desc:'+1 armor and +5 max HP',apply:p=>{p.armor++;p.maxHp+=5;p.hp+=5}},{name:'Fleet Feet',icon:'👟',desc:'+10% movement speed',apply:p=>p.speed*=1.1},{name:'Keen Senses',icon:'🎯',desc:'+5% critical chance',apply:p=>p.crit+=.05},{name:'Field Dressing',icon:'💗',desc:'+10 max HP and heal 10',apply:p=>{p.maxHp+=10;p.hp=Math.min(p.maxHp,p.hp+10)}},{name:'Lucky Find',icon:'🍀',desc:'+10 luck and pickup range',apply:p=>{p.luck+=10;p.pickup+=10}},{name:'Vital Spark',icon:'🌿',desc:'+0.5 regeneration / sec',apply:p=>p.regen+=.5}];
let game;
function freshGame(char=0){const bonus=CHARACTERS[char].bonus;return {time:0,wave:1,waveTime:30,coins:0,kills:0,elapsed:0,reroll:6,rerolls:0,lock:false,locked:null,player:{x:0,y:0,r:14,hp:100+(bonus.maxHp||0),maxHp:100+(bonus.maxHp||0),coins:0,regen:0,damage:10,attackSpeed:1+(bonus.attackSpeed||0),speed:150+(bonus.speed||0),crit:.05,armor:bonus.armor||0,luck:bonus.luck||0,pickup:66+(bonus.pickup||0),xp:0,level:1,xpNeed:5,invuln:0,dash:0,dashCd:0,weapons:[{id:'pistol',level:1,cool:0}]},enemies:[],bullets:[],enemyBullets:[],coinsDrop:[],particles:[],texts:[],spawn:0,shake:0,shopItems:[],bossSpawned:false,character:char};}
function save(){try{const old=JSON.parse(localStorage.getItem('starbyte-save')||'{}');localStorage.setItem('starbyte-save',JSON.stringify({best:Math.max(old.best||0,game.wave),unlocks:old.unlocks||[0,1,2]}))}catch{}}
function sound(freq=420,dur=.05,type='sine',vol=.025){if(muted)return;try{soundCtx ||= new (AudioContext||webkitAudioContext)();const o=soundCtx.createOscillator(),g=soundCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,soundCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,soundCtx.currentTime+dur);o.connect(g);g.connect(soundCtx.destination);o.start();o.stop(soundCtx.currentTime+dur)}catch{}}
function showToast(t){const el=$('toast');el.textContent=t;el.style.opacity=1;el.style.transform='translate(-50%,0)';clearTimeout(showToast.t);showToast.t=setTimeout(()=>{el.style.opacity=0;el.style.transform='translate(-50%,-10px)'},1300)}
function showPanel(html,wide=false){panel.innerHTML=html;panel.classList.toggle('wide',wide);overlay.classList.remove('hidden')}
function startGame(char=chosenChar){chosenChar=char;game=freshGame(char);state='playing';overlay.classList.add('hidden');hud.classList.remove('hidden');$('hint').classList.remove('hidden');audioInit();updateHud()}
function audioInit(){if(!muted)try{soundCtx ||= new (AudioContext||webkitAudioContext)();if(soundCtx.state==='suspended')soundCtx.resume()}catch{}}
function menu(){state='menu';hud.classList.add('hidden');$('hint').classList.add('hidden');const saveData=(()=>{try{return JSON.parse(localStorage.getItem('starbyte-save')||'{}')}catch{return {}}})();showPanel(`<div class="eyebrow">A pocket-sized arena roguelite</div><div class="title">STAR<span class="accent">BYTE</span></div><div class="subtitle">Build your loadout. Outlast the swarm. Make it to the final boss.<br><b>10 waves · 30 seconds each · endless upgrades</b></div><div class="character-row">${CHARACTERS.map((c,i)=>`<button class="char ${i===chosenChar?'selected':''}" data-char="${i}"><strong>${c.icon} ${c.name}</strong><span>${c.desc}</span></button>`).join('')}</div><div class="actions"><button class="btn primary" id="start">DROP IN　→</button><button class="btn ghost" id="how">HOW TO PLAY</button><div class="muted" style="align-self:center">BEST WAVE　<b style="color:var(--gold)">${saveData.best||0}</b></div></div><div class="muted" style="margin-top:15px">Move with the left stick (or WASD). Your weapon aims and fires automatically.</div>`);
panel.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>{chosenChar=+b.dataset.char;menu()});$('start').onclick=()=>startGame(chosenChar);$('how').onclick=()=>helpMenu()}
function helpMenu(){showPanel(`<div class="eyebrow">Quick briefing</div><div class="title" style="font-size:38px">HOW TO <span class="accent">SURVIVE</span></div><p class="subtitle">① Move with the left joystick or WASD / arrow keys. You attack the nearest enemy automatically.<br><br>② Collect glowing coins and XP orbs by walking near them.<br><br>③ Level up for a free stat boost. Between waves, spend coins in the shop. Buy duplicate weapons to make them stronger.<br><br>④ Survive all 10 waves. Watch out for the wave 10 boss!</p><div class="actions"><button class="btn primary" id="back">GOT IT</button></div>`);$('back').onclick=menu}

menu();
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='Escape'||e.key.toLowerCase()==='p')pauseGame()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
$('pause').onclick=pauseGame;$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'×':'♫';if(!muted)audioInit();showToast(muted?'Sound off':'Sound on')};
let joy={active:false,id:null,x:0,y:0,dx:0,dy:0};const stick=$('stick'),knob=$('knob');
function joyStart(e){const r=stick.getBoundingClientRect();joy.active=true;joy.id=e.pointerId;joy.x=r.left+r.width/2;joy.y=r.top+r.height/2;stick.setPointerCapture(e.pointerId);joyMove(e)}function joyMove(e){if(!joy.active||e.pointerId!==joy.id)return;let dx=e.clientX-joy.x,dy=e.clientY-joy.y,l=Math.hypot(dx,dy),max=39;if(l>max){dx*=max/l;dy*=max/l}joy.dx=dx/max;joy.dy=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}function joyEnd(e){if(e.pointerId!==joy.id)return;joy.active=false;joy.dx=joy.dy=0;knob.style.transform=''}stick.addEventListener('pointerdown',joyStart);stick.addEventListener('pointermove',joyMove);stick.addEventListener('pointerup',joyEnd);stick.addEventListener('pointercancel',joyEnd);
const ENEMY_TYPES={chaser:{hp:30,speed:57,damage:12,r:12,color:'#ff718e',xp:1,coins:1},fast:{hp:17,speed:100,damage:9,r:9,color:'#ffd36d',xp:1,coins:1},tank:{hp:100,speed:29,damage:21,r:19,color:'#b699ff',xp:3,coins:3},shooter:{hp:37,speed:39,damage:8,r:13,color:'#68e0db',xp:2,coins:2},exploder:{hp:25,speed:67,damage:23,r:12,color:'#ff9d59',xp:1,coins:2},boss:{hp:1350,speed:34,damage:28,r:34,color:'#ff427e',xp:18,coins:25}};
function spawnEnemy(type){let a=rand(0,Math.PI*2),dist=Math.max(W,H)*.65+50,x=game.player.x+Math.cos(a)*dist,y=game.player.y+Math.sin(a)*dist;const def=ENEMY_TYPES[type],scale=1+(game.wave-1)*.19+(type==='boss'?0:game.time*.004);game.enemies.push({type,x,y,r:def.r,hp:def.hp*scale,maxHp:def.hp*scale,speed:def.speed*(1+(game.wave-1)*.025),damage:def.damage*(1+(game.wave-1)*.08),color:def.color,xp:def.xp,coins:def.coins,cool:rand(.8,2),flash:0,knock:0,phase:rand(0,5)})}
function emit(x,y,color,n=5,speed=100){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),v=rand(speed*.35,speed);game.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:rand(1.5,4),life:rand(.18,.55),max:.55,color})}}

function takeDamage(amount){const p=game.player;if(p.invuln>0)return;p.hp-=Math.max(1,amount-p.armor*1.6);p.invuln=.48;game.shake=8;emit(p.x,p.y,'#ff738b',12,170);sound(130,.12,'sawtooth',.04);if(p.hp<=0){p.hp=0;updateHud();gameOver(false)}}
function grantXp(n){const p=game.player;p.xp+=n;while(p.xp>=p.xpNeed){p.xp-=p.xpNeed;p.level++;p.xpNeed=Math.ceil(p.xpNeed*1.34+1);levelUp()}}
function levelUp(){if(state!=='playing')return;state='levelup';const opts=[...UPGRADES].sort(()=>Math.random()-.5).slice(0,3);showPanel(`<div class="eyebrow">Level ${game.player.level} · pick one upgrade</div><div class="title" style="font-size:clamp(30px,6vw,46px)">LEVEL <span class="accent">UP!</span></div><div class="grid">${opts.map((u,i)=>`<div class="pick" data-up="${i}"><div class="emoji">${u.icon}</div><h3>${u.name}</h3><p>${u.desc}</p></div>`).join('')}</div>`);panel.querySelectorAll('[data-up]').forEach((el,i)=>el.onclick=()=>{opts[i].apply(game.player);sound(700,.12,'triangle');state='playing';overlay.classList.add('hidden');updateHud()})}
function waveShop(){if(game.wave>=10){gameOver(true);return}state='shop';game.wave++;game.waveTime=30;game.spawn=1;game.bossSpawned=false;game.rerolls=0;game.reroll=6+game.wave*2;game.shopItems=makeShop();renderShop()}
function renderShop(){const p=game.player,avail=game.shopItems;let lockText=game.lock?'UNLOCK ITEMS':'LOCK ITEMS';showPanel(`<div class="row"><div><div class="eyebrow">Wave ${game.wave-1} clear · gear up</div><div class="title" style="font-size:clamp(30px,6vw,44px)">THE <span class="accent">SCRAP SHOP</span></div></div><div class="hudbox" style="color:var(--gold);font-weight:900">◈ ${p.coins}</div></div><div class="muted">Buy upgrades or weapons. A duplicate weapon improves its level.</div><div class="shopgrid">${avail.map((item,i)=>{let weapon=item.weapon,price=weapon?item.price:item.price;return `<article class="shopitem"><div><div class="row"><span class="emoji">${item.icon}</span><span class="tag">${weapon?'WEAPON':'ITEM'}</span></div><h3>${item.name}${weapon&&findWeapon(item.id)?` +${findWeapon(item.id).level}`:''}</h3><p>${item.desc}</p></div><button class="btn ${p.coins>=price?'primary':'ghost'}" data-buy="${i}">◈ ${price}　BUY</button></article>`}).join('')}</div><div class="row"><div class="muted">Reroll <b style="color:var(--gold)">◈ ${game.reroll}</b> · used ${game.rerolls}×</div><div class="actions" style="margin:0"><button class="btn small ghost" id="lock">${lockText}</button><button class="btn small ghost" id="reroll">↻ REROLL</button><button class="btn small primary" id="next">WAVE ${game.wave} →</button></div></div><div class="muted" style="margin-top:12px">Weapons owned: ${p.weapons.map(w=>`${WEAPONS[w.id].icon} ${WEAPONS[w.id].name} Lv${w.level}`).join(' · ')}</div>`,true);
panel.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buyItem(+b.dataset.buy));$('lock').onclick=()=>{game.lock=!game.lock;renderShop()};$('reroll').onclick=()=>{if(p.coins<game.reroll){showToast('Not enough coins');return}p.coins-=game.reroll;game.reroll=Math.ceil(game.reroll*1.55);game.rerolls++;if(!game.lock)game.shopItems=makeShop();sound(540,.08);renderShop()};$('next').onclick=()=>{state='playing';overlay.classList.add('hidden');updateHud()}}
function findWeapon(id){return game.player.weapons.find(w=>w.id===id)}
function makeShop(){let pool=[...SHOP].sort(()=>Math.random()-.5).slice(0,3);if(Math.random()<.8){const id=choice(Object.keys(WEAPONS)),w=WEAPONS[id],owned=findWeapon(id);pool.push({weapon:true,id,name:w.name,icon:w.icon,desc:owned?`Upgrade your ${w.name} for more power.`:w.desc+' New weapon.',price:owned?20+owned.level*10:24+Math.floor(Math.random()*9)})}else pool.push([...SHOP].sort(()=>Math.random()-.5)[0]);return pool.sort(()=>Math.random()-.5)}
function buyItem(i){const item=game.shopItems[i],p=game.player;if(!item||p.coins<item.price){showToast('Not enough coins');return}p.coins-=item.price;if(item.weapon){const own=findWeapon(item.id);if(own){own.level++;own.cool=0;showToast(`${item.name} upgraded to Lv ${own.level}`)}else{p.weapons.push({id:item.id,level:1,cool:0});showToast(`${item.name} equipped!`)}}else item.apply(p);sound(660,.1,'triangle');emit(p.x,p.y,'#ffd36d',8,90);updateHud();renderShop()}
function updateHud(){if(!game)return;let p=game.player;$('hptext').textContent=`♥ ${Math.ceil(p.hp)} / ${Math.ceil(p.maxHp)}`;$('hpbar').style.width=`${clamp(p.hp/p.maxHp*100,0,100)}%`;$('leveltext').textContent=`LV ${p.level}`;$('xpbar').style.width=`${clamp(p.xp/p.xpNeed*100,0,100)}%`;$('statline').textContent=`DMG ${Math.round(p.damage)} · ARM ${Math.round(p.armor)} · SPD ${Math.round(p.speed)}`;$('wavetext').textContent=`${game.wave}/10`;$('timertext').textContent=`${Math.ceil(game.waveTime)}s`;$('cointext').textContent=p.coins}
function targetNearest(){const p=game.player;let best=null,bd=Infinity;for(const e of game.enemies){let d=(e.x-p.x)**2+(e.y-p.y)**2;if(d<bd){bd=d;best=e}}return best}
function fireWeapons(dt){const p=game.player,target=targetNearest();for(const slot of p.weapons){slot.cool-=dt;if(slot.cool>0||!target)continue;const w=WEAPONS[slot.id],level=slot.level,dx=target.x-p.x,dy=target.y-p.y,dist=Math.hypot(dx,dy),angle=Math.atan2(dy,dx);if(w.type==='melee'){if(dist<w.range+target.r){const hits=game.enemies.filter(e=>Math.hypot(e.x-p.x,e.y-p.y)<w.range+e.r&&(Math.cos(Math.atan2(e.y-p.y,e.x-p.x)-angle)>.12));hits.forEach(e=>hitEnemy(e,w.damage*p.damage/10*(1+(level-1)*.52),w.color,angle));emit(p.x+Math.cos(angle)*40,p.y+Math.sin(angle)*40,w.color,8,90)}slot.cool=w.rate/p.attackSpeed/Math.pow(1.09,level-1);sound(280,.045,'triangle',.012);continue}
if(dist>w.range+40)continue;const bullets=w.pellets+(slot.id==='shotgun'&&level>=3?2:0);for(let n=0;n<bullets;n++){const a=angle+rand(-w.spread,w.spread),speed=w.projectile*(slot.id==='flame'?rand(.8,1.1):1),crit=Math.random()<p.crit,damage=w.damage*(p.damage/10)*(1+(level-1)*.43)*(crit?2:1);game.bullets.push({x:p.x+Math.cos(a)*16,y:p.y+Math.sin(a)*16,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r:slot.id==='flame'?7:4,damage,life:w.range/speed,color:w.color,crit,flame:slot.id==='flame',pierce:slot.id==='smg'&&level>=4?1:0})}slot.cool=w.rate/p.attackSpeed/Math.pow(1.1,level-1);sound(slot.id==='shotgun'?175:slot.id==='flame'?320:slot.id==='smg'?540:460,slot.id==='shotgun'?.09:.035,slot.id==='shotgun'?'square':'sine',slot.id==='shotgun'?.025:.009)}}
function hitEnemy(e,damage,color,angle=0){if(e.hp<=0)return;e.hp-=damage;e.flash=.1;e.knock=5;game.shake=Math.max(game.shake,1.6);if(Math.random()<.35||damage>35)floatText(e.x+rand(-5,5),e.y-e.r,`${Math.round(damage)}${damage>=30?'!':''}`,damage>=30?'#ffe17a':'#fff',damage>=30?14:11);emit(e.x,e.y,color,3,65);if(e.hp<=0){game.kills++;const def=ENEMY_TYPES[e.type];game.coinsDrop.push({x:e.x,y:e.y,r:6,kind:'coin',value:def.coins});game.coinsDrop.push({x:e.x+rand(-8,8),y:e.y+rand(-8,8),r:e.type==='boss'?7:5,kind:'xp',value:def.xp});if(e.type==='boss'){for(let i=0;i<8;i++)game.coinsDrop.push({x:e.x+rand(-30,30),y:e.y+rand(-30,30),r:6,kind:'coin',value:3})}emit(e.x,e.y,e.color,e.type==='boss'?35:10,150);sound(200,.04,'triangle',.01)}}
function dash(){if(state!=='playing'||!game||game.player.dashCd>0)return;const p=game.player;let x=joy.dx+(keys.d?1:0)-(keys.a?1:0),y=joy.dy+(keys.s?1:0)-(keys.w?1:0),l=Math.hypot(x,y);if(l<.1){const t=targetNearest();if(t){x=p.x-t.x;y=p.y-t.y;l=Math.hypot(x,y)}}if(l<.1){x=1;y=0;l=1}p.dashX=x/l;p.dashY=y/l;p.dash=.16;p.dashCd=2;p.invuln=Math.max(p.invuln,.2);emit(p.x,p.y,'#c8f36a',12,110);sound(250,.12,'sawtooth',.018)}$('dash').addEventListener('pointerdown',dash);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();dash()}});
function update(dt){if(state!=='playing'||!game)return;const p=game.player;dt=Math.min(dt,.04);game.elapsed+=dt;game.waveTime-=dt;game.time+=dt;p.invuln=Math.max(0,p.invuln-dt);p.dashCd=Math.max(0,p.dashCd-dt);p.hp=Math.min(p.maxHp,p.hp+p.regen*dt);game.shake=Math.max(0,game.shake-dt*20);
let mx=joy.dx+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=joy.dy+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}if(p.dash>0){p.dash=Math.max(0,p.dash-dt);p.x+=p.dashX*p.speed*3.3*dt;p.y+=p.dashY*p.speed*3.3*dt}else{p.x+=mx*p.speed*dt;p.y+=my*p.speed*dt}
game.spawn-=dt;if(game.spawn<=0&&!(game.wave===10&&game.bossSpawned)){let types=['chaser','chaser','fast'];if(game.wave>=2)types.push('tank');if(game.wave>=3)types.push('shooter');if(game.wave>=4)types.push('exploder');spawnEnemy(choice(types));game.spawn=Math.max(.16,.88-(game.wave-1)*.055)}if(game.wave===10&&!game.bossSpawned&&game.waveTime<27){spawnEnemy('boss');game.bossSpawned=true;showToast('⚠ THE STAR DEVOURER')}
fireWeapons(dt);
for(let i=game.bullets.length-1;i>=0;i--){let b=game.bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.flame&&Math.random()<.7)emit(b.x,b.y,b.color,1,18);let hit=false;for(const e of game.enemies){if(e.hp<=0)continue;if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){hitEnemy(e,b.damage,b.color);if(b.pierce>0)b.pierce--;else{hit=true;break}}}if(hit||b.life<=0)game.bullets.splice(i,1)}
for(let i=game.enemyBullets.length-1;i>=0;i--){const b=game.enemyBullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(Math.hypot(b.x-p.x,b.y-p.y)<p.r+b.r){takeDamage(b.damage);game.enemyBullets.splice(i,1)}else if(b.life<=0)game.enemyBullets.splice(i,1)}
for(let i=game.enemies.length-1;i>=0;i--){const e=game.enemies[i];if(e.hp<=0){game.enemies.splice(i,1);continue}e.flash=Math.max(0,e.flash-dt);let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;if(e.type==='shooter'&&d<255){e.cool-=dt;if(e.cool<=0){let a=Math.atan2(dy,dx);game.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*190,vy:Math.sin(a)*190,r:5,damage:e.damage,life:2});e.cool=1.6;emit(e.x,e.y,e.color,2,45)}}else{e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt}if(d<e.r+p.r+1){if(e.type==='exploder'){takeDamage(e.damage);e.hp=0;emit(e.x,e.y,'#ff9d59',20,180);game.shake=12}else{takeDamage(e.damage*dt*1.7);e.x-=dx/d*e.speed*dt*.5}}}
for(let i=game.coinsDrop.length-1;i>=0;i--){let c=game.coinsDrop[i],dx=p.x-c.x,dy=p.y-c.y,d=Math.hypot(dx,dy);if(d<p.pickup){let pull=clamp((p.pickup-d)/p.pickup,0,1);c.x+=dx*pull*dt*5;c.y+=dy*pull*dt*5}if(d<p.r+c.r+5){if(c.kind==='coin'){p.coins+=c.value;floatText(c.x,c.y,`+${c.value} ◈`,'#ffd36d',11);sound(720,.035,'sine',.008)}else grantXp(c.value);game.coinsDrop.splice(i,1)}}
for(let arr of [game.particles,game.texts])for(let i=arr.length-1;i>=0;i--){let q=arr[i];q.life-=dt;if(q.vx!==undefined){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=Math.pow(.08,dt);q.vy*=Math.pow(.08,dt)}else q.y-=24*dt;if(q.life<=0)arr.splice(i,1)}
if(state!=='playing')return;if(game.wave===10&&game.bossSpawned&&!game.enemies.some(e=>e.type==='boss')){gameOver(true);return}if(game.waveTime<=0){if(game.wave===10&&game.bossSpawned&&game.enemies.some(e=>e.type==='boss')){game.waveTime=30;showToast('Defeat the Star Devourer!')}else waveShop()}updateHud()}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawBackdrop(){ctx.fillStyle='#111827';ctx.fillRect(0,0,W,H);let g=ctx.createRadialGradient(W*.5,H*.42,20,W*.5,H*.5,Math.max(W,H)*.8);g.addColorStop(0,'#1c2940');g.addColorStop(1,'#101524');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#a5c1e509';ctx.lineWidth=1;let gap=46,ox=(game?-(game.player.x%gap):0)+W/2%gap,oy=(game?-(game.player.y%gap):0)+H/2%gap;for(let x=ox;x<W;x+=gap){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=oy;y<H;y+=gap){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let i=0;i<26;i++){let x=(i*173+42)%W,y=(i*239+64)%H;ctx.fillStyle=i%3===0?'#c8f36a10':'#fff7';ctx.beginPath();ctx.arc(x,y,i%4===0?2:1,0,Math.PI*2);ctx.fill()}}
function drawPlayer(){const p=game.player;ctx.save();ctx.translate(p.x,p.y);if(p.invuln>0&&Math.floor(game.time*22)%2===0)ctx.globalAlpha=.46;ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(2,8,15,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c8f36a';ctx.beginPath();ctx.arc(0,0,p.r+1,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e7ffab';ctx.beginPath();ctx.arc(-4,-5,8,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#23331f';ctx.beginPath();ctx.arc(4,-2,2,0,Math.PI*2);ctx.arc(-3,-2,2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#23331f';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(.5,2,4,.2,Math.PI-.2);ctx.stroke();ctx.restore()}
function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);let pulse=e.type==='boss'?1+Math.sin(game.time*5)*.045:1;ctx.scale(pulse,pulse);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(2,e.r*.64,e.r*1.1,e.r*.43,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=e.flash>0?'#fff':e.color;ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fill();if(e.type==='tank'||e.type==='boss'){ctx.strokeStyle='#ffffff99';ctx.lineWidth=e.type==='boss'?4:2;ctx.beginPath();ctx.arc(0,0,e.r-3,0,Math.PI*2);ctx.stroke()}if(e.type==='fast'){ctx.fillStyle='#fff9';ctx.beginPath();ctx.moveTo(-e.r,-3);ctx.lineTo(-e.r-8,-8);ctx.lineTo(-e.r+2,2);ctx.fill()}if(e.type==='exploder'){ctx.fillStyle='#ffeab0';ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill()}if(e.type==='shooter'){ctx.fillStyle='#19323a';ctx.beginPath();ctx.arc(-4,-2,2,0,Math.PI*2);ctx.arc(4,-2,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d9ffff';ctx.beginPath();ctx.arc(0,5,3,0,Math.PI);ctx.fill()}if(e.type==='chaser'||e.type==='tank'||e.type==='boss'){ctx.fillStyle='#301d31';ctx.beginPath();ctx.arc(-4,-2,2,0,Math.PI*2);ctx.arc(4,-2,2,0,Math.PI*2);ctx.fill()}if(e.type==='boss'){ctx.font='900 11px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('STAR DEVOURER',0,-e.r-18);ctx.fillStyle='#171b2b';rounded(-38,-e.r-12,76,6,3);ctx.fillStyle='#ff718e';rounded(-37,-e.r-11,74*clamp(e.hp/e.maxHp,0,1),4,2)}if(e.hp<e.maxHp&&e.type!=='boss'){ctx.fillStyle='#151a28';rounded(-e.r,-e.r-8,e.r*2,4,2);ctx.fillStyle='#c8f36a';rounded(-e.r,-e.r-8,e.r*2*clamp(e.hp/e.maxHp,0,1),4,2)}ctx.restore()}
function render(){drawBackdrop();if(!game)return;ctx.save();let sx=rand(-game.shake,game.shake),sy=rand(-game.shake,game.shake);ctx.translate(W/2-game.player.x+sx,H/2-game.player.y+sy);
// tiny arena floor motes
for(let i=0;i<24;i++){let x=Math.floor(game.player.x/160)*160+(i%6)*160-400,y=Math.floor(game.player.y/160)*160+Math.floor(i/6)*160-300;ctx.fillStyle='#ffffff0b';ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill()}
for(const c of game.coinsDrop){if(c.kind==='coin'){ctx.fillStyle='#ffcf57';ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff0a4';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#9a6217';ctx.font='bold 8px system-ui';ctx.textAlign='center';ctx.fillText('¢',c.x,c.y+3)}else{ctx.fillStyle='#68e0db';ctx.beginPath();ctx.arc(c.x,c.y+Math.sin(game.time*5+c.x)*2,c.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d5ffff';ctx.lineWidth=1;ctx.stroke()}}
for(const b of game.bullets){ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=b.flame?12:5;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}for(const b of game.enemyBullets){ctx.fillStyle='#ff718e';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffc1c9';ctx.stroke()}
for(const e of game.enemies)drawEnemy(e);drawPlayer();for(const q of game.particles){ctx.globalAlpha=clamp(q.life/q.max,0,1);ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const t of game.texts){ctx.globalAlpha=clamp(t.life/t.max,0,1);ctx.font=`900 ${t.size}px system-ui`;ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#101524';ctx.strokeText(t.text,t.x,t.y);ctx.fillStyle=t.color;ctx.fillText(t.text,t.x,t.y)}ctx.globalAlpha=1;ctx.restore();
}
function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;update(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script>
